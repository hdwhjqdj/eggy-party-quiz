<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#1a0d12">
<title>测测你是蛋仔派对里的哪只蛋</title>
<style>
  :root{
    --bg:#1a0d12;
    --bg2:#2a1520;
    --ink:#f4e0c8;
    --ink2:#d4b896;
    --muted:#8a6870;
    --rule:#4a2030;
    --accent:#a01525;
    --accent2:#c82030;
    --deep:#7a0e18;
    --gold:#b8873a;
    --gold2:#e0b847;
    --tint:#3a1a25;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
  html,body{margin:0; padding:0}
  body{
    background:var(--bg); color:var(--ink);
    font-family:"Songti SC","Noto Serif SC","Georgia","SimSun",serif;
    font-size:16px; line-height:1.7; -webkit-font-smoothing:antialiased;
    overscroll-behavior-y:contain;
  }
  body::before{
    content:""; position:fixed; inset:0; pointer-events:none; z-index:0;
    background:
      radial-gradient(600px 500px at 88% -6%, rgba(224,184,71,.10), transparent 60%),
      radial-gradient(800px 600px at -10% 42%, rgba(160,21,37,.14), transparent 60%),
      radial-gradient(900px 700px at 50% 112%, rgba(122,14,24,.18), transparent 60%),
      radial-gradient(300px 300px at 50% 50%, rgba(184,135,58,.06), transparent 70%);
  }
  body::after{
    content:"⚜️ 🖤 ⚜️ 🥚 ⚜️ 🖤";
    position:fixed; bottom:0; left:0; right:0; z-index:0; pointer-events:none;
    font-size:36px; color:rgba(184,135,58,.07); letter-spacing:32px; font-weight:700;
    overflow:hidden; white-space:nowrap;
  }
  [hidden]{display:none !important}
  button{font-family:inherit; font-size:inherit; color:inherit; border:none; background:none; cursor:pointer; touch-action:manipulation}
  .app{max-width:520px; margin:0 auto; background:transparent; min-height:100vh; min-height:100svh; position:relative; z-index:1}
  .screen{min-height:100vh; min-height:100svh; display:flex; flex-direction:column}

  /* ---------- 封面 ---------- */
  #s-cover{padding:calc(34px + env(safe-area-inset-top)) 22px calc(26px + env(safe-area-inset-bottom)); position:relative}
  #s-cover::before{
    content:"⚜️"; position:absolute; top:calc(44px + env(safe-area-inset-top)); left:18px;
    font-size:22px; color:var(--gold); z-index:3; opacity:.6;
  }
  #s-cover::after{
    content:"⚜️"; position:absolute; top:calc(44px + env(safe-area-inset-top)); right:18px;
    font-size:22px; color:var(--gold); z-index:3; opacity:.6;
  }
  #s-cover>div{
    display:flex; flex-direction:column; flex:1; min-height:0; position:relative; z-index:2;
    border:2px solid var(--gold); border-radius:6px; padding:28px 20px 22px;
    background:linear-gradient(180deg, rgba(42,21,32,.85), rgba(26,13,18,.92));
    box-shadow:0 0 0 1px var(--deep), 0 0 0 3px var(--bg), 0 20px 60px rgba(0,0,0,.6);
    position:relative;
  }
  #s-cover>div::before{
    content:""; position:absolute; top:4px; left:4px; right:4px; bottom:4px;
    border:1px solid rgba(184,135,58,.25); border-radius:4px; pointer-events:none;
  }
  .kicker{font-size:11px; letter-spacing:.32em; color:var(--gold2); font-weight:700; text-transform:uppercase; border-bottom:1px solid var(--rule); padding-bottom:10px}
  .cover-mid{flex:1; display:flex; flex-direction:column; justify-content:center; padding:24px 0}
  .cover-title{
    font-size:44px; line-height:1.15; font-weight:900; letter-spacing:-1px; margin:16px 0 10px;
    background:linear-gradient(135deg, var(--gold) 0%, var(--gold2) 45%, #fff 70%, var(--gold2) 100%);
    -webkit-background-clip:text; background-clip:text; color:transparent;
    filter:drop-shadow(0 2px 8px rgba(224,184,71,.3));
  }
  .cover-sub{font-size:17px; color:var(--ink2); font-weight:600; margin:0 0 16px; font-style:italic; letter-spacing:.05em}
  .cover-desc{font-size:14px; color:var(--muted); margin:0 0 22px; max-width:400px; line-height:1.8; border-left:2px solid var(--gold); padding-left:14px}
  .facts{display:flex; gap:8px; flex-wrap:wrap; margin-bottom:26px}
  .fact{
    background:linear-gradient(180deg, var(--tint), var(--bg2));
    border:1px solid var(--gold); border-radius:0; padding:6px 14px;
    font-size:12px; color:var(--ink2); letter-spacing:.05em;
    box-shadow:inset 0 0 0 1px var(--deep);
  }
  .fact b{color:var(--gold2); font-weight:800}
  .btn{display:flex; align-items:center; justify-content:center; width:100%; min-height:58px; border-radius:4px; font-size:16px; font-weight:800; letter-spacing:.15em; transition:transform .12s ease, box-shadow .2s ease; position:relative; overflow:hidden}
  .btn:active{transform:scale(.985)}
  .btn-primary{
    background:linear-gradient(135deg, var(--deep) 0%, var(--accent) 50%, var(--deep) 100%);
    color:var(--gold2); border:2px solid var(--gold);
    box-shadow:0 8px 28px rgba(0,0,0,.5), inset 0 1px 0 rgba(255,255,255,.1), inset 0 0 0 4px var(--bg);
  }
  .btn-primary::before{content:"⚜️ "; margin-right:4px; font-size:14px}
  .btn-primary::after{content:""; position:absolute; inset:0; background:linear-gradient(120deg, transparent 30%, rgba(224,184,71,.18) 50%, transparent 70%); pointer-events:none; animation:shine 3s infinite}
  @keyframes shine{0%{opacity:.2} 50%{opacity:.7} 100%{opacity:.2}}
  .cover-note{font-size:11px; color:var(--muted); text-align:center; margin:14px 0 0; line-height:1.8; letter-spacing:.08em; border-top:1px solid var(--rule); padding-top:12px}
  .deco{position:absolute; pointer-events:none; user-select:none; opacity:.5; z-index:3; color:var(--gold)}
  .deco-1{top:calc(60px + env(safe-area-inset-top)); right:32px; font-size:28px; transform:rotate(15deg); color:var(--gold2); text-shadow:0 0 12px rgba(224,184,71,.4)}
  .deco-2{top:140px; left:28px; font-size:18px; opacity:.5; color:var(--accent2)}
  .deco-3{bottom:170px; right:38px; font-size:24px; opacity:.55; transform:rotate(-10deg)}
  .deco-4{top:280px; left:50px; font-size:16px; opacity:.4; color:var(--gold2)}
  .deco-5{bottom:100px; left:40px; font-size:22px; opacity:.5}
  .deco-6{top:200px; right:50px; font-size:14px; opacity:.5; color:var(--accent)}

  /* ---------- 答题 ---------- */
  .qbar{
    position:sticky; top:0; z-index:5;
    background:rgba(26,13,18,.95); backdrop-filter:blur(8px);
    padding:calc(12px + env(safe-area-inset-top)) 18px 10px;
    border-bottom:2px solid var(--gold); box-shadow:0 4px 20px rgba(0,0,0,.6);
  }
  .qbar-row{display:flex; align-items:center; gap:12px}
  .iconbtn{
    width:36px; height:36px; border-radius:0; border:1px solid var(--gold);
    background:var(--bg2); display:flex; align-items:center; justify-content:center;
    font-size:17px; color:var(--gold2); font-weight:700;
    box-shadow:inset 0 0 0 1px var(--deep);
  }
  .iconbtn:disabled{opacity:.3}
  .qmeta{flex:1}
  .qcount{display:flex; justify-content:space-between; font-size:11px; color:var(--muted); margin-bottom:6px; letter-spacing:.1em}
  .qcount b{color:var(--gold2); font-weight:800}
  .pbar{
    height:8px; background:var(--bg2); border-radius:2px; overflow:hidden;
    box-shadow:inset 0 1px 3px rgba(0,0,0,.6), 0 0 0 1px var(--rule);
  }
  .pbar i{
    display:block; height:100%; width:0; border-radius:1px;
    background:linear-gradient(90deg, var(--deep) 0%, var(--accent) 50%, var(--gold) 100%);
    box-shadow:0 0 12px rgba(160,21,37,.6);
    transition:width .32s cubic-bezier(.2,.8,.2,1);
    position:relative;
  }
  .pbar i::after{content:""; position:absolute; right:0; top:0; bottom:0; width:14px; background:linear-gradient(90deg, transparent, rgba(224,184,71,.7)); border-radius:1px; animation:shine 2s infinite}
  .qbody{flex:1; padding:30px 22px calc(30px + env(safe-area-inset-bottom)); display:flex; flex-direction:column}
  .qno{font-size:11px; letter-spacing:.3em; color:var(--gold); font-weight:800; margin-bottom:14px; text-transform:uppercase}
  .qno::before{content:"⚜️ "; font-size:10px; color:var(--gold2)}
  .qtext{
    font-size:22px; line-height:1.5; font-weight:700; letter-spacing:-.3px; margin:0 0 8px;
    color:var(--ink); position:relative; padding-left:16px;
  }
  .qtext::before{content:""; position:absolute; left:0; top:6px; bottom:6px; width:3px; background:linear-gradient(180deg, var(--gold), var(--accent)); border-radius:1px}
  .hint{font-size:12px; color:var(--muted); margin:0 0 26px; letter-spacing:.05em; font-style:italic}
  .opts{display:flex; flex-direction:column; gap:12px}
  .opt{
    background:linear-gradient(180deg, var(--bg2), var(--tint));
    border:1.5px solid var(--rule); border-radius:2px; padding:16px 18px;
    text-align:left; font-size:15px; line-height:1.65; min-height:58px; display:flex; align-items:center;
    transition:border-color .16s, background .16s, transform .1s, box-shadow .16s;
    box-shadow:inset 0 0 0 1px var(--rule);
  }
  .opt:active{transform:scale(.99); background:var(--tint)}
  .opt.on{
    border-color:var(--gold); background:linear-gradient(180deg, #3a1a25, #2a1520);
    box-shadow:inset 0 0 0 1px var(--gold), 0 0 16px rgba(184,135,58,.3);
  }
  .opt .dot{width:8px; height:8px; border-radius:50%; background:var(--rule); margin-right:14px; flex:none; transition:background .16s}
  .opt.on .dot{
    background:var(--gold2); box-shadow:0 0 0 3px rgba(224,184,71,.25), 0 0 0 6px rgba(160,21,37,.35);
    animation:pulse 1.2s infinite;
  }
  @keyframes pulse{0%,100%{box-shadow:0 0 0 3px rgba(224,184,71,.25), 0 0 0 6px rgba(160,21,37,.35)} 50%{box-shadow:0 0 0 4px rgba(224,184,71,.4), 0 0 0 8px rgba(160,21,37,.55)}}
  .qfoot{margin-top:auto; padding-top:22px; font-size:11px; color:var(--muted); letter-spacing:.05em}

  /* ---------- 加载 ---------- */
  #loading{position:fixed; inset:0; background:var(--bg); z-index:40; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:18px}
  .spinner{width:38px; height:38px; border:3px solid var(--rule); border-top-color:var(--gold); border-radius:50%; animation:spin .8s linear infinite; box-shadow:0 0 0 3px rgba(184,135,58,.2)}
  @keyframes spin{to{transform:rotate(360deg)}}
  #loading p{font-size:13px; color:var(--gold2); margin:0; letter-spacing:.1em; font-weight:700}
  #loading p::before{content:"⚜️ "; margin-right:2px}

  /* ---------- 结果 ---------- */
  #s-result{padding:0 0 calc(34px + env(safe-area-inset-bottom))}
  .res-top{padding:calc(16px + env(safe-area-inset-top)) 18px 10px; display:flex; justify-content:space-between; align-items:center}
  .res-brand{font-size:11px; letter-spacing:.24em; color:var(--gold); font-weight:800; text-transform:uppercase}
  .res-brand::before{content:"⚜️ "; font-size:10px; color:var(--gold2)}
  .hero{
    margin:6px 18px 0; border-radius:4px; padding:28px 22px 22px;
    border:2px solid var(--gold); box-shadow:0 20px 60px rgba(0,0,0,.6), inset 0 0 0 1px var(--gold);
    position:relative; overflow:hidden;
  }
  .hero::before{
    content:""; position:absolute; top:0; left:0; right:0; height:3px;
    background:linear-gradient(90deg, transparent, var(--gold2) 50%, transparent);
  }
  .hero::after{
    content:"⚜️"; position:absolute; top:14px; right:18px;
    font-size:18px; opacity:.45; color:var(--gold); text-shadow:0 0 10px rgba(224,184,71,.4);
  }
  .hero.t-hei{background:linear-gradient(160deg, #1a0a0e, #2a1018); --deep:#1a0a0e}
  .hero.t-ji{background:linear-gradient(160deg, #1a1510, #2a2018); --deep:#1a1510}
  .hero.t-zai{background:linear-gradient(160deg, #101a14, #1a2a20); --deep:#101a14}
  .hero.t-huang{background:linear-gradient(160deg, #1a1810, #2a2418); --deep:#1a1810}
  .hero .you{font-size:11px; letter-spacing:.28em; color:var(--gold); font-weight:800; text-transform:uppercase}
  .hero h1{
    font-size:40px; line-height:1.15; font-weight:900; letter-spacing:-1px; margin:10px 0 10px;
    background:linear-gradient(135deg, var(--gold) 0%, var(--gold2) 50%, #fff 80%);
    -webkit-background-clip:text; background-clip:text; color:transparent;
  }
  .hero .role-emoji{font-size:32px; margin-right:6px}
  .hero .quote{font-family:"Songti SC","Noto Serif SC",serif; font-size:17px; line-height:1.6; margin:0 0 18px; color:var(--ink2); font-weight:500; font-style:italic}
  .hero .stats{display:grid; grid-template-columns:repeat(3,1fr); gap:8px; border-top:1px solid var(--rule); padding-top:14px}
  .hero .stat .v{font-size:24px; font-weight:900; letter-spacing:-.6px; color:var(--gold2); line-height:1.2}
  .hero .stat .v small{font-size:11px; font-weight:600; color:var(--muted); margin-left:2px}
  .hero .stat .k{font-size:11px; color:var(--muted); margin-top:3px; line-height:1.4; letter-spacing:.05em}
  .savehint{font-size:11px; color:var(--muted); margin:12px 0 0; display:flex; align-items:center; gap:6px; letter-spacing:.05em}

  .sec{
    margin:16px 18px 0;
    background:linear-gradient(180deg, var(--bg2), var(--tint));
    border:1px solid var(--gold); border-radius:4px; padding:20px 18px;
    box-shadow:0 6px 20px rgba(0,0,0,.5), inset 0 0 0 1px var(--deep);
    transition:transform .18s, box-shadow .18s;
  }
  .sec:hover{transform:translateY(-2px); box-shadow:0 12px 30px rgba(0,0,0,.6), inset 0 0 0 1px var(--gold)}
  .sec-h{display:flex; align-items:baseline; justify-content:space-between; gap:10px; margin-bottom:12px}
  .sec-h h2{font-size:16px; font-weight:800; margin:0; letter-spacing:-.2px; color:var(--ink); border-bottom:1px solid var(--rule); padding-bottom:6px; flex:1}
  .sec-h .tag{font-size:10px; letter-spacing:.16em; color:var(--gold); font-weight:800; border:1px solid var(--gold); padding:2px 8px; background:var(--bg); white-space:nowrap}
  .lead{font-size:14px; color:var(--muted); margin:0 0 14px; line-height:1.7}
  .need{font-size:13px; color:var(--muted); margin:0 0 4px}
  .need b{color:var(--ink2); font-weight:600}

  .bars{display:flex; flex-direction:column; gap:13px}
  .bar-row{display:grid; grid-template-columns:70px 1fr 34px; align-items:center; gap:10px}
  .bar-row .lb{font-size:12px; color:var(--ink2); font-weight:600}
  .bar-row .track{display:block; height:9px; background:var(--bg); border-radius:1px; overflow:hidden; box-shadow:inset 0 1px 2px rgba(0,0,0,.6)}
  .bar-row .fill{display:block; height:100%; width:0; border-radius:1px; background:var(--rule); transition:width .9s cubic-bezier(.2,.8,.2,1)}
  .bar-row.low .fill{background:linear-gradient(90deg, var(--accent), var(--accent2))}
  .bar-row.high .fill{background:linear-gradient(90deg, var(--gold), var(--gold2))}
  .bar-row .val{font-size:13px; font-weight:800; text-align:right; color:var(--muted); font-variant-numeric:tabular-nums}
  .bar-row.low .val{color:var(--accent2)}
  .bar-row.high .val{color:var(--gold2)}
  .chips{display:flex; gap:6px; flex-wrap:wrap; margin-top:14px}
  .chip{font-size:11px; padding:4px 10px; border-radius:0; border:1px solid; font-weight:700; letter-spacing:.05em}
  .chip.low{color:var(--accent2); border-color:var(--accent); background:rgba(160,21,37,.15)}
  .chip.high{color:var(--gold2); border-color:var(--gold); background:rgba(184,135,58,.12)}

  .scenes{margin:12px 0 0; padding:0; list-style:none; display:flex; flex-direction:column; gap:8px}
  .scenes li{font-size:13.5px; color:var(--ink2); background:var(--bg); border-radius:2px; padding:10px 14px; line-height:1.6; border:1px solid var(--rule)}
  .scenes li::before{content:"⚜️ "; font-size:10px; letter-spacing:.1em; color:var(--gold); font-weight:700; margin-right:4px}

  .accel{counter-reset:a; margin:0; padding:0; list-style:none; display:flex; flex-direction:column; gap:14px}
  .accel li{position:relative; padding-left:40px; font-size:15px; line-height:1.7; color:var(--ink2)}
  .accel li::before{
    counter-increment:a; content:"⚜️" counter(a);
    position:absolute; left:0; top:-2px; width:32px; height:32px; border-radius:0;
    background:linear-gradient(135deg, var(--deep), var(--accent));
    color:var(--gold2); font-size:12px; font-weight:900; display:flex; align-items:center; justify-content:center;
    box-shadow:0 2px 8px rgba(160,21,37,.5), inset 0 0 0 1px var(--gold);
  }

  .say{margin-top:16px; background:var(--bg); border-radius:2px; padding:14px 16px; border:1px solid var(--gold); box-shadow:inset 0 0 0 1px var(--deep)}
  .say .k{font-size:10px; letter-spacing:.2em; color:var(--gold); font-weight:800; margin-bottom:6px; text-transform:uppercase}
  .say p{margin:0; font-size:15px; line-height:1.65}

  .btn-copy{
    display:flex; align-items:center; justify-content:center; width:100%; min-height:52px; border-radius:4px; font-size:14px; font-weight:700;
    color:var(--gold2); background:linear-gradient(135deg, var(--deep), var(--accent));
    border:2px solid var(--gold); margin-top:16px; letter-spacing:.1em;
    box-shadow:0 8px 24px rgba(0,0,0,.5), inset 0 1px 0 rgba(255,255,255,.08);
    transition:transform .12s, box-shadow .16s;
  }
  .btn-copy:active{transform:scale(.98); box-shadow:0 4px 14px rgba(0,0,0,.4)}
  .btn-copy::before{content:"⚜️ "; margin-right:4px}

  .restart{margin:16px auto 0; font-size:13px; color:var(--gold2); text-decoration:underline; text-underline-offset:3px; font-weight:600; letter-spacing:.05em}
  .disclaimer{font-size:11px; line-height:1.8; color:var(--muted); text-align:left; border-top:1px solid var(--rule); padding-top:14px; margin:0; letter-spacing:.05em}

  #toast{position:fixed; left:50%; bottom:34px; transform:translate(-50%,16px); background:linear-gradient(135deg, var(--deep), var(--accent)); color:var(--gold2); font-size:13px; padding:10px 18px; border-radius:2px; opacity:0; pointer-events:none; transition:opacity .22s, transform .22s; z-index:60; max-width:86vw; text-align:center; letter-spacing:.05em; border:1px solid var(--gold); box-shadow:0 8px 24px rgba(0,0,0,.6)}
  #toast.show{opacity:1; transform:translate(-50%,0)}

  @media (max-width: 380px){
    .cover-title{font-size:36px}
    .qtext{font-size:20px}
    .hero h1{font-size:32px}
  }
</style>
</head>
<body>
<div class="app">

  <section id="s-cover" class="screen">
    <span class="deco deco-1">⚜️</span>
    <span class="deco deco-2">🖤</span>
    <span class="deco deco-3">🥚</span>
    <span class="deco deco-4">👑</span>
    <span class="deco deco-5">⚜️</span>
    <span class="deco deco-6">🖤</span>
    <div>
      <div class="kicker">Egggy Party · 粉丝趣味测试 · 非官方</div>
      <div class="cover-mid">
        <h1 class="cover-title">你是<br>哪只蛋？</h1>
        <p class="cover-sub">⚜️ 蛋仔派对性格原型测试 ⚜️</p>
        <p class="cover-desc">18 道情境题，测出你在那个圆滚滚的世界里究竟是谁。不是看你玩得好不好，是看你骨子里是什么样的蛋。</p>
        <div class="facts">
          <div class="fact"><b>18</b> 题</div>
          <div class="fact">约 <b>3</b> 分钟</div>
          <div class="fact"><b>4</b> 种蛋格</div>
        </div>
      </div>
      <button class="btn btn-primary" id="startBtn">开启蛋格鉴定</button>
      <p class="cover-note">按第一反应选。不收集任何信息。<br>本测试为粉丝创作，与网易蛋仔派对官方无关。</p>
    </div>
  </section>

  <section id="s-quiz" class="screen" hidden>
    <div class="qbar">
      <div class="qbar-row">
        <button class="iconbtn" id="backBtn" aria-label="上一题" disabled>←</button>
        <div class="qmeta">
          <div class="qcount"><span>第 <b id="qNow">1</b> / 18 题</span><span id="qPct">0%</span></div>
          <div class="pbar"><i id="pFill"></i></div>
        </div>
      </div>
    </div>
    <div class="qbody">
      <div class="qno" id="qNo">Q01</div>
      <h2 class="qtext" id="qText">　</h2>
      <p class="hint">凭第一感觉，不用想太深</p>
      <div class="opts" id="opts"></div>
      <div class="qfoot">可以点左上角返回上一题修改。</div>
    </div>
  </section>

  <section id="s-result" class="screen" hidden>
    <div class="res-top">
      <span class="res-brand">Egggy Party Archetype</span>
      <span class="res-brand" id="resDate"></span>
    </div>

function shuffle(a){
  for(var i=a.length-1;i>0;i--){
    var j = Math.floor(Math.random()*(i+1));
    var t = a[i]; a[i]=a[j]; a[j]=t;
  }
  return a;
}

function initOrders(){
  orders = QUESTIONS.map(function(){ return shuffle([0,1,2]); });
}

function show(el){ el.hidden = false; }
function hide(el){ el.hidden = true; }

function startQuiz(){
  answers = new Array(18).fill(null);
  current = 0;
  initOrders();
  hide(els.cover);
  hide(els.result);
  show(els.quiz);
  window.scrollTo(0,0);
  renderQuestion();
}

function renderQuestion(){
  var q = QUESTIONS[current];
  els.qNow.textContent = current + 1;
  var pct = Math.round(current / QUESTIONS.length * 100);
  els.qPct.textContent = pct + "%";
  els.qFill.style.width = pct + "%";
  els.qNo.textContent = "Q" + ("0" + (current+1)).slice(-2);
  els.qText.textContent = q.text;
  els.back.disabled = current === 0;

  var html = "";
  orders[current].forEach(function(idx){
    var o = q.options[idx];
    var on = answers[current] === o.score ? " on" : "";
    html += '<button class="opt'+on+'" data-score="'+o.score+'"><span class="dot"></span><span>'+o.text+'</span></button>';
  });
  els.opts.innerHTML = html;
  window.scrollTo(0,0);
}

function choose(score){
  answers[current] = score;
  var nodes = els.opts.querySelectorAll(".opt");
  for(var i=0;i<nodes.length;i++){
    nodes[i].classList.toggle("on", Number(nodes[i].getAttribute("data-score")) === score);
  }
  var locked = true;
  var idx = current;
  setTimeout(function(){
    if(!locked) return;
    if(current !== idx) return;
    if(current < QUESTIONS.length - 1){
      current++;
      renderQuestion();
    } else {
      finish();
    }
  }, 220);
}

els.opts.addEventListener("click", function(e){
  var btn = e.target.closest(".opt");
  if(!btn) return;
  choose(Number(btn.getAttribute("data-score")));
});

els.back.addEventListener("click", function(){
  if(current > 0){
    current--;
    renderQuestion();
  }
});

/* ---------------- 计分 ---------------- */
function calc(){
  var coreRaw = 0, selfRaw = 0;
  for(var i=0;i<12;i++) coreRaw += answers[i];
  for(var j=12;j<18;j++) selfRaw += answers[j];

  var dims = {};
  DIM_ORDER.forEach(function(d, di){
    var s = 0;
    for(var k=0;k<3;k++) s += answers[di*3 + k];
    dims[d] = Math.round(s / 6 * 100);
  });

  var core = Math.round(coreRaw / 24 * 100);   // 蛋格核心特质分
  var self = Math.round(selfRaw / 12 * 100);   // 自我认同分
  var vibe = Math.round((100 - self) * 0.5 + (100 - core) * 0.5); // 神秘指数

  var coreHigh = core >= 50, selfHigh = self >= 50;
  var typeKey;
  if(coreHigh && selfHigh) typeKey = "hei";
  else if(coreHigh && !selfHigh) typeKey = "zai";
  else if(!coreHigh && selfHigh) typeKey = "ji";
  else typeKey = "huang";

  var lowKey = DIM_ORDER.reduce(function(a,b){ return dims[b] < dims[a] ? b : a; });
  var highKey = DIM_ORDER.filter(function(d){ return d !== lowKey; })
    .reduce(function(a,b){ return dims[b] > dims[a] ? b : a; }, DIM_ORDER[0] === lowKey ? DIM_ORDER[1] : DIM_ORDER[0]);

  return {
    core: core, self: self, vibe: vibe,
    dims: dims, type: TYPES[typeKey], lowKey: lowKey, highKey: highKey
  };
}

function band(v){
  if(v < 25) return "深藏不露";
  if(v < 50) return "有点神秘";
  if(v < 75) return "比较坦荡";
  return "完全透明";
}

function finish(){
  hide(els.quiz);
  show(els.loading);
  setTimeout(function(){
    hide(els.loading);
    renderResult();
    show(els.result);
    window.scrollTo(0,0);
  }, 620);
}

  var barsHtml = DIM_ORDER.map(function(k){
    var v = r.dims[k];
    var cls = k === r.lowKey ? "low" : (k === r.highKey ? "high" : "");
    return '<div class="bar-row '+cls+'">'+
      '<span class="lb">'+DIMS[k].label+'</span>'+
      '<span class="track"><i class="fill" data-w="'+v+'"></i></span>'+
      '<span class="val">'+v+'</span></div>';
  }).join("");

  var accelHtml = t.accel.map(function(s){ return '<li>'+s+'</li>'; }).join("");
  var scenesHtml = low.scenes.map(function(s){ return '<li>'+s+'</li>'; }).join("");

  els.resultBox.innerHTML =
    '<div class="hero t-'+t.key+'">'+
      '<div class="you">你的蛋格是</div>'+
      '<h1>'+t.name+'</h1>'+
      '<p class="quote">'+t.quote+'</p>'+
      '<p class="need"><b>蛋格画像：</b>'+t.identity+'</p>'+
      '<p class="need" style="margin-bottom:14px"><b>典型行为：</b>'+t.behavior+'</p>'+
      '<div class="stats">'+
        '<div class="stat"><div class="v">'+r.core+'<small>/100</small></div><div class="k">核心特质</div></div>'+
        '<div class="stat"><div class="v">'+r.self+'<small>/100</small></div><div class="k">自我认同</div></div>'+
        '<div class="stat"><div class="v">'+r.vibe+'<small>/100</small></div><div class="k">神秘指数 · '+band(r.vibe)+'</div></div>'+
      '</div>'+
      '<div class="savehint">⚜️ 截图这一页，就是你的蛋格鉴定卡。</div>'+
    '</div>'+

    '<div class="sec">'+
      '<div class="sec-h"><h2>你的四维蛋格维度</h2><span class="tag">0–100</span></div>'+
      '<p class="lead">分数越高，在这个维度上的特质越明显。最低的维度是你最值得关注的方向。</p>'+
      '<div class="bars">'+barsHtml+'</div>'+
      '<div class="chips"><span class="chip low">短板 '+low.label+' '+r.dims[r.lowKey]+'</span><span class="chip high">优势 '+high.label+' '+r.dims[r.highKey]+'</span></div>'+
    '</div>'+

    '<div class="sec">'+
      '<div class="sec-h"><h2>你的短板：'+low.label+'</h2><span class="tag">'+r.dims[r.lowKey]+' 分</span></div>'+
      '<p class="lead">'+low.low+'</p>'+
      '<ul class="scenes">'+scenesHtml+'</ul>'+
      '<p class="lead" style="margin:14px 0 0">你的优势在「'+high.label+'」：'+high.high+'</p>'+
    '</div>'+

    '<div class="sec">'+
      '<div class="sec-h"><h2>⚜️ 三日实验清单</h2><span class="tag">本周就做</span></div>'+
      '<p class="lead">三件小事。不用改性格，就试试打破一下节奏。</p>'+
      '<ol class="accel">'+accelHtml+'</ol>'+
    '</div>'+

    '<div class="sec">'+
      '<div class="sec-h"><h2>适合一起玩的蛋</h2><span class="tag">互补参考</span></div>'+
      '<p class="lead"><b>'+t.fit+'</b></p>'+
    '</div>'+

    '<div class="sec">'+
      '<div class="sec-h"><h2>想给朋友也测一下？</h2><span class="tag">分享玩法</span></div>'+
      '<p class="lead">把这个测试发给朋友，看看他是蛋小黑还是鸡块妹——你们是冤家还是搭子？</p>'+
      '<button class="btn-copy" id="copyBtn">复制我的蛋格鉴定卡</button>'+
    '</div>'+

    '<div style="padding:14px 18px 0">'+
      '<p class="disclaimer">本测试为粉丝创作的趣味性格探索工具，与网易蛋仔派对官方无关。题目与结果描述的是你当前更习惯的行为模式与性格倾向，不构成对游戏水平、人格高低或任何能力的评价。</p>'+
    '</div>';

  requestAnimationFrame(function(){
    setTimeout(function(){
      var fills = els.resultBox.querySelectorAll(".fill");
      for(var i=0;i<fills.length;i++){
        fills[i].style.width = fills[i].getAttribute("data-w") + "%";
      }
    }, 80);
  });

  document.getElementById("copyBtn").addEventListener("click", copyManual);
}

function copyManual(){
  var r = calc();
  var t = r.type;
  var text =
    "我的蛋格鉴定卡 ⚜️\n"+
    "我是「"+t.name+"」——"+t.quote.replace(/[「」『』]/g,"")+"\n"+
    "核心特质 "+r.core+" / 自我认同 "+r.self+" / 神秘指数 "+r.vibe+"（"+band(r.vibe)+"）\n\n"+
    "蛋格画像：\n"+t.identity+"\n\n"+
    "三日实验清单：\n"+
    t.accel.map(function(s,i){ return (i+1)+". "+s; }).join("\n")+"\n\n"+
    "（来自「测测你是蛋仔派对里的哪只蛋」，粉丝趣味测试，非官方）";

  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(function(){ toast("已复制，可以发给蛋搭子了"); }, function(){ fallbackCopy(text); });
  } else {
    fallbackCopy(text);
  }
}

function fallbackCopy(text){
  var ta = document.createElement("textarea");
  ta.value = text;
  ta.setAttribute("readonly","");
  ta.style.position = "fixed";
  ta.style.left = "-9999px";
  document.body.appendChild(ta);
  ta.select();
  var ok = false;
  try { ok = document.execCommand("copy"); } catch(e){ ok = false; }
  document.body.removeChild(ta);
  toast(ok ? "已复制，可以发给蛋搭子了" : "复制失败，请长按文字手动复制");
}

var toastTimer = null;
function toast(msg){
  els.toast.textContent = msg;
  els.toast.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(function(){ els.toast.classList.remove("show"); }, 2200);
}

/* ---------------- 事件 ---------------- */
document.getElementById("startBtn").addEventListener("click", startQuiz);
document.getElementById("restartBtn").addEventListener("click", function(){
  hide(els.result);
  startQuiz();
});
</script>
